<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forza Horizon 6 Roulette</title>
<meta name="description" content="Random build/race challenge generator for Forza Horizon 6.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1><span class="accent">Forza Horizon 6</span> Roulette</h1>
      <p class="tagline">Spin up a random race, car, and challenge for Forza Horizon 6</p>
    </div>
  </header>

  <main class="wrap">
    <div class="global-actions">
      <div class="actions-left">
        <button type="button" id="reset-spin" class="btn">🧹 Reset Spin</button>
        <button type="button" id="reset-filters" class="btn">↺ Reset Filters</button>
      </div>
      <div class="actions-center">
        <button type="button" id="spin-all" class="btn btn-primary btn-big">🎲 SPIN ALL</button>
        <button type="button" id="copy-challenge" class="btn">📋 Copy Challenge</button>
      </div>
      <div class="actions-right">
        <button type="button" id="show-weights" class="btn">⚖️ Weights</button>
        <button type="button" id="show-data-table" class="btn">📊 Show Data</button>
      </div>
    </div>

    <div class="settings-bar">
      <label class="toggle-switch">
        <input type="checkbox" id="weighted-toggle">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-label">Weighted by rarity <em>(more cars/races = picked more often)</em></span>
      </label>
      <label class="toggle-switch">
        <input type="checkbox" id="strict-toggle">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-label">Strict mode <em>(never roll "Any")</em></span>
      </label>
      <label class="toggle-switch">
        <input type="checkbox" id="stock-only-toggle">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-label">Stock cars only <em>(Performance Class - no tuning headroom)</em></span>
      </label>
      <label class="toggle-switch">
        <input type="checkbox" id="exclude-long-tracks-toggle">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-label">Exclude Long Tracks <em>(The Titan, The Gauntlet, The Colossus, The Goliath)</em></span>
      </label>
    </div>

    <section class="group-section preset-section">
      <h2 class="group-heading">🎨 Preset Filters</h2>
      <p class="preset-intro">Each preset fully replaces your current filters with its own theme. Hover a preset for details.</p>
      <div id="preset-filters" class="preset-filters"></div>
    </section>

    <section class="group-section">
      <h2 class="group-heading">🏁 Race</h2>
      <div id="race-categories" class="grid"></div>
    </section>

    <section class="group-section">
      <h2 class="group-heading">🚗 Car Build</h2>
      <div id="car-categories" class="grid"></div>
    </section>

    <section class="history-section">
      <div class="history-header">
        <h2>Challenge History</h2>
        <button type="button" id="clear-history" class="btn btn-tiny">Clear</button>
      </div>
      <div id="history-list" class="history-list"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <div id="data-modal" class="modal-overlay hidden">
    <div class="modal-panel">
      <div class="modal-header">
        <h2>FH6 Data Browser</h2>
        <button type="button" id="data-modal-close" class="btn btn-tiny">✕ Close</button>
      </div>
      <div class="modal-tabs">
        <button type="button" class="modal-tab active" data-modal-tab="cars">Cars (636)</button>
        <button type="button" class="modal-tab" data-modal-tab="races">Races (81)</button>
      </div>
      <input type="search" id="data-modal-search" class="filter-search modal-search" placeholder="Search...">
      <div id="data-modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="weights-modal" class="modal-overlay hidden">
    <div class="modal-panel">
      <div class="modal-header">
        <h2>Adjust Weights</h2>
        <button type="button" id="weights-modal-close" class="btn btn-tiny">✕ Close</button>
      </div>
      <div class="modal-tabs">
        <button type="button" class="modal-tab" data-weights-tab="race">Race Type</button>
        <button type="button" class="modal-tab" data-weights-tab="carType">Car Type</button>
        <button type="button" class="modal-tab" data-weights-tab="country">Country</button>
        <button type="button" class="modal-tab" data-weights-tab="brand">Brand</button>
        <button type="button" class="modal-tab" data-weights-tab="decade">Decade</button>
      </div>
      <div id="weights-modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="data/raceTypes.js"></script>
  <script src="data/individualRaces.js"></script>
  <script src="data/carTypes.js"></script>
  <script src="data/brands.js"></script>
  <script src="data/countries.js"></script>
  <script src="data/decades.js"></script>
  <script src="data/classes.js"></script>
  <script src="data/seasons.js"></script>
  <script src="data/cars.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
